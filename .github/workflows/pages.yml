name: Demo site

# Publishes the Blazor WebAssembly demo to gh-pages for https://music.panoramicdata.com/.
on:
  push:
    branches: [main]
    paths:
      - 'PanoramicData.MusicGeneration/**'
      - 'PanoramicData.MusicGeneration.Demo/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-site
  cancel-in-progress: true

env:
  SITE_BASE: /

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Publish demo
      run: dotnet publish PanoramicData.MusicGeneration.Demo --configuration Release --output site

    # The custom domain serves from /. The 404 copy supports deep links; .nojekyll preserves _framework.
    - name: Prepare Pages files
      run: |
        sed -i "s#<base href=\"/\" />#<base href=\"${SITE_BASE}\" />#" site/wwwroot/index.html
        echo "music.panoramicdata.com" > site/wwwroot/CNAME
        cp site/wwwroot/index.html site/wwwroot/404.html
        touch site/wwwroot/.nojekyll

    - name: Deploy to gh-pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: site/wwwroot
        branch: gh-pages
        single-commit: true
        clean: true
